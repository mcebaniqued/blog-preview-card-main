<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class="page">
    <section class="container">
      <img class="image" src="./assets/images/illustration-article.svg" alt="Illustration Article"/>
      <div class="tag-container">
        <span class="tag">Learning</span>
      </div>
      <h4 class="date">Published 21 Dec 2023</h4>
      <h1>HTML & CSS foundations</h1>
      <p class="description">These languages are the backbone of every website, defining structure, content and presentation.</p>
      <footer class="footer">
        <img class="avatar" src="./assets/images/image-avatar.webp" alt="Avatar Image"/>
        <p class="user-name">Greg Hooper</p>
      </footer>
    </section>
  </main>
</body>
</html>
